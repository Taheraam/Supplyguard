[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "supplyguard"
version = "0.3.4"
description = "AI-Aware Software Supply Chain Security Scanner & Self-Healing Remediation Engine"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "SupplyGuard Maintainers"}
]
keywords = [
    "security",
    "supply-chain",
    "sbom",
    "vulnerability-scanner",
    "sast",
    "secrets-detection",
    "remediation",
    "sarif",
    "cli",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    "click>=8.1.0",
    "flask>=3.0.0",
    "sqlalchemy>=2.0.0",
    "requests>=2.31.0",
    "cyclonedx-bom>=3.11.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
    "anthropic>=0.20.0",
    "packaging>=21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-mock>=3.10.0",
    "responses>=0.23.0",
    "ruff>=0.1.0",
    "black>=23.0.0",
]

[project.urls]
Homepage = "https://github.com/Taheraam/Supplyguard"
Repository = "https://github.com/Taheraam/Supplyguard"
Documentation = "https://github.com/Taheraam/Supplyguard#readme"
"Bug Tracker" = "https://github.com/Taheraam/Supplyguard/issues"

[project.scripts]
supplyguard = "supplyguard.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["supplyguard*"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
