<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}SupplyGuard — AI-Aware Software Supply Chain Security{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <nav class="navbar">
    <a href="/" class="nav-brand">
      🛡️ <span>SupplyGuard</span>
    </a>
    <div class="nav-links">
      <a href="/" class="nav-link">Dashboard</a>
      <a href="https://github.com/google/supplyguard" target="_blank" class="nav-link">Documentation</a>
    </div>
  </nav>

  <main class="main-container">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <p>SupplyGuard v0.2.0 • AI-Aware Software Supply Chain Security & Self-Healing Engine • Open Source</p>
  </footer>

  <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
