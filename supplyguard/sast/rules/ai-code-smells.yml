rules:
  - id: ai-sql-injection-concat
    languages: [python]
    severity: ERROR
    message: "SQL query constructed via string concatenation or f-string formatting (CWE-89). Use parameterized queries instead."
    metadata:
      cwe: "CWE-89"
      strategy: "LLM_ASSISTED"
      category: "security"
    patterns:
      - pattern-either:
          - pattern: $CURSOR.execute(f"...", ...)
          - pattern: $CURSOR.execute("..." % (...), ...)
          - pattern: $CURSOR.execute("..." + $VAR, ...)
          - pattern: $DB.execute(f"...", ...)
          - pattern: $DB.execute("..." % (...), ...)
          - pattern: $DB.execute("..." + $VAR, ...)

  - id: ai-unprotected-admin-route
    languages: [python]
    severity: WARNING
    message: "Sensitive admin/delete/update route defined without authentication decorator or security dependency (CWE-862)."
    metadata:
      cwe: "CWE-862"
      strategy: "MANUAL_REQUIRED"
      category: "security"
    patterns:
      - pattern-either:
          - pattern: |
              @$APP.route(..., methods=[..., "DELETE", ...])
              def $FUNC(...):
                  ...
          - pattern: |
              @$APP.route(..., methods=[..., "POST", ...])
              def $FUNC(...):
                  ...
          - pattern: |
              @$ROUTER.delete(...)
              def $FUNC(...):
                  ...
      - pattern-not: |
          @$APP.route(...)
          @$AUTH_DECORATOR(...)
          def $FUNC(...):
              ...
      - pattern-not: |
          @$APP.route(...)
          @login_required
          def $FUNC(...):
              ...

  - id: ai-unsafe-eval-exec-pickle
    languages: [python]
    severity: ERROR
    message: "Dynamic code execution or unsafe deserialization on variable input (CWE-94 / CWE-502)."
    metadata:
      cwe: "CWE-94"
      strategy: "MANUAL_REQUIRED"
      category: "security"
    patterns:
      - pattern-either:
          - pattern: eval($X, ...)
          - pattern: exec($X, ...)
          - pattern: pickle.loads($X, ...)
      - pattern-not: eval("...", ...)
      - pattern-not: exec("...", ...)

  - id: ai-subprocess-shell-true
    languages: [python]
    severity: ERROR
    message: "Subprocess invocation with shell=True and dynamic arguments (CWE-78). Convert to argument list with shell=False."
    metadata:
      cwe: "CWE-78"
      strategy: "LLM_ASSISTED"
      category: "security"
    patterns:
      - pattern-either:
          - pattern: subprocess.run($CMD, ..., shell=True, ...)
          - pattern: subprocess.Popen($CMD, ..., shell=True, ...)
          - pattern: subprocess.check_output($CMD, ..., shell=True, ...)
          - pattern: subprocess.call($CMD, ..., shell=True, ...)
      - pattern-not: subprocess.run("...", ..., shell=True, ...)

  - id: ai-requests-verify-false
    languages: [python]
    severity: WARNING
    message: "TLS certificate validation explicitly disabled with verify=False (CWE-295)."
    metadata:
      cwe: "CWE-295"
      strategy: "DETERMINISTIC"
      category: "security"
    patterns:
      - pattern-either:
          - pattern: requests.get(..., verify=False, ...)
          - pattern: requests.post(..., verify=False, ...)
          - pattern: requests.put(..., verify=False, ...)
          - pattern: requests.delete(..., verify=False, ...)
          - pattern: requests.request(..., verify=False, ...)
    fix-regex:
      regex: ',\s*verify\s*=\s*False'
      replacement: ''

  - id: ai-flask-debug-true
    languages: [python]
    severity: WARNING
    message: "Flask application executed with debug=True (CWE-489). Never run in debug mode in production."
    metadata:
      cwe: "CWE-489"
      strategy: "DETERMINISTIC"
      category: "security"
    pattern: $APP.run(..., debug=True, ...)
    fix: $APP.run(..., debug=False, ...)

  - id: ai-weak-hash-md5-sha1
    languages: [python]
    severity: WARNING
    message: "Weak hash algorithm (MD5/SHA1) used for security-sensitive operation (CWE-916). Use bcrypt, argon2, or sha256."
    metadata:
      cwe: "CWE-916"
      strategy: "LLM_ASSISTED"
      category: "security"
    patterns:
      - pattern-either:
          - pattern: hashlib.md5(...)
          - pattern: hashlib.sha1(...)

  - id: ai-jwt-unverified-decode
    languages: [python]
    severity: ERROR
    message: "JWT decoded without signature verification or with algorithm none (CWE-347)."
    metadata:
      cwe: "CWE-347"
      strategy: "DETERMINISTIC"
      category: "security"
    patterns:
      - pattern-either:
          - pattern: jwt.decode(..., verify=False, ...)
          - pattern: jwt.decode(..., options={"verify_signature": False}, ...)
    fix-regex:
      regex: 'verify\s*=\s*False'
      replacement: 'verify=True'

  - id: ai-cors-wildcard-with-credentials
    languages: [python]
    severity: WARNING
    message: "CORS configuration allows wildcard origin '*' alongside credentials (CWE-942)."
    metadata:
      cwe: "CWE-942"
      strategy: "MANUAL_REQUIRED"
      category: "security"
    patterns:
      - pattern-either:
          - pattern: CORS($APP, origins="*", supports_credentials=True, ...)
          - pattern: CORS($APP, resources={...: {"origins": "*", "supports_credentials": True}}, ...)
          - pattern: |
              $RESP.headers['Access-Control-Allow-Origin'] = '*'
              $RESP.headers['Access-Control-Allow-Credentials'] = 'true'

  - id: ai-insecure-random-token
    languages: [python]
    severity: WARNING
    message: "Insecure pseudo-random generator 'random' used for security token/secret generation (CWE-330). Use 'secrets' module."
    metadata:
      cwe: "CWE-330"
      strategy: "DETERMINISTIC"
      category: "security"
    patterns:
      - pattern-either:
          - pattern: random.choice($CHARS)
          - pattern: random.randint(..., ...)
          - pattern: random.random()
    fix-regex:
      regex: 'random\.choice\('
      replacement: 'secrets.choice('
