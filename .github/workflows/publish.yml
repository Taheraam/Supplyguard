name: Publish to PyPI

# One trigger only. Firing on both `release` and tag `push` uploaded the same version
# twice, and PyPI rejects the second upload.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    name: Test before release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -e ".[dev]"
      - run: pytest tests/ -v

  build:
    name: Build sdist + wheel
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install build && python -m build
      - name: Release tag must match pyproject version
        run: |
          VERSION=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v${VERSION}" = "${GITHUB_REF_NAME}" || { echo "::error::tag ${GITHUB_REF_NAME} != v${VERSION}"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish-to-pypi:
    name: Publish (Trusted Publishing / OIDC)
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/supplyguard
    permissions:
      id-token: write  # short-lived OIDC token instead of a stored PyPI API token
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      # No `password:` input → the action uses PyPI Trusted Publishing and
      # uploads signed provenance attestations.
      - uses: pypa/gh-action-pypi-publish@release/v1
