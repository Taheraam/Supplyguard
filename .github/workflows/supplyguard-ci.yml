name: SupplyGuard CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.18.4"
  # From https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_checksums.txt
  GITLEAKS_SHA256: "ba6dbb656933921c775ee5a2d1c13a91046e7952e9d919f9bac4cec61d628e7d"

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - run: pip install -e ".[dev]"
      - run: pytest tests/ -v --tb=short

  package:
    name: Wheel ships its assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install build && python -m build
      # Install the built wheel into a clean venv (not the source tree) and check that
      # templates, static files and Semgrep rules made it into the package.
      - run: |
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/pip install dist/*.whl
          cd /tmp
          /tmp/wheel-env/bin/supplyguard --version
          /tmp/wheel-env/bin/python - <<'PY'
          from importlib.resources import files
          for pkg, asset in [("supplyguard.web", "templates/base.html"),
                             ("supplyguard.web", "static/js/dashboard.js"),
                             ("supplyguard.sast", "rules/ai-code-smells.yml")]:
              assert files(pkg).joinpath(asset).is_file(), f"missing from wheel: {pkg}/{asset}"
          print("wheel assets OK")
          PY

  security-gate:
    name: Self-scan (SARIF + blocking gate)
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      security-events: write  # SARIF upload
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so gitleaks can scan past commits
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install SupplyGuard + real scanners
        run: |
          pip install -e . semgrep
          curl -sSfL -o gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          sudo tar xzf gitleaks.tgz -C /usr/local/bin gitleaks && rm gitleaks.tgz

      # Record the exit code instead of `continue-on-error: true`, which made the gate decorative:
      # the build stayed green no matter what the scan found.
      - name: Scan
        id: scan
        run: |
          set +e
          supplyguard scan . --format sarif --threshold 40 -o results.sarif \
            --db-path ci_supplyguard.db --sbom-output sbom.cdx.json
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Upload SARIF to GitHub code scanning
        if: always() && hashFiles('results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
          category: supplyguard

      - name: Upload SBOM + results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supplyguard-results
          path: |
            results.sarif
            sbom.cdx.json
          if-no-files-found: ignore

      - name: Enforce gate (0 = pass, 1 = risk over threshold, 2 = scanner error)
        if: steps.scan.outputs.exit_code != '0'
        run: |
          echo "::error::SupplyGuard gate failed with exit code ${{ steps.scan.outputs.exit_code }}"
          exit 1
